# Cloudflare Workers Static Assets + canonical host redirect worker
name = "bwax-services"
compatibility_date = "2025-07-01"
workers_dev = false
preview_urls = false
main = "src/worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true
